name: Compilar Debian 13 amd64
run-name: Debian13 / ${{ inputs.solicitud }}
on:
  workflow_dispatch:
    inputs:
      solicitud:
        description: Identificador único para encontrar esta ejecución
        required: true
        type: string
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: debian:13-slim
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CFLAGS: -O2 -march=x86-64-v2 -mtune=generic
      CXXFLAGS: -O2 -march=x86-64-v2 -mtune=generic
    steps:
      - name: Instalar herramientas en Debian remoto
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential pkg-config file binutils python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 pkexec udisks2 util-linux sudo xvfb xauth dbus-x11 desktop-file-utils fonts-dejavu-core
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compilar y comprobar destino
        run: bash .github/scripts/compilar-debian.sh
      - name: Preparar comprobantes y paquete
        run: |
          test -n "$(find artifacts -type f -print -quit)"
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          test "$(dpkg --print-architecture)" = amd64
          {
            printf 'Destino: Debian 13 amd64 / Celeron B820\n'
            printf 'Commit: %s\n' "$GITHUB_SHA"
            printf 'Run: %s\n' "$GITHUB_RUN_ID"
            printf 'CFLAGS: %s\n' "$CFLAGS"
            getconf GNU_LIBC_VERSION
            gcc --version | head -n 1
          } > artifacts/entorno.txt
          mkdir -p entrega
          tar -czf entrega/programas.tar.gz -C artifacts .
          cp artifacts/entorno.txt entrega/
          cd entrega
          sha256sum programas.tar.gz entorno.txt > SHA256SUMS
      - name: Guardar resultados descargables
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debian13-amd64
          path: entrega/
          if-no-files-found: error
          retention-days: 3
